<text transform="translate(93 1945) rotate(-90)" font-size="13.5" textLength="1555" lengthAdjust="spacingAndGlyphs">* Permet au pharmacien de substituer le médicament sauf marqué avec les lettres NS (Non Substituable) dans le cadre, conformément à l'article 47 de pratique de la profession de pharmacie au Liban après l'accord du patient.</text>
<text transform="translate(1592 392) rotate(-90)" font-size="21" text-anchor="start" direction="rtl" textLength="1540" lengthAdjust="spacingAndGlyphs" font-family="'Traditional Arabic', 'Geeza Pro', 'Noto Naskh Arabic', 'Noto Sans Arabic', Tahoma, Arial, sans-serif">* يُسمح للصيدلي باستبدال الدواء ما عدا المؤشر عليه بحرفي NS (Non Substituable) في المربع، عملاً بالمادة 47 من قانون مزاولة مهنة الصيدلة وبعد موافقة المريض.</text>
